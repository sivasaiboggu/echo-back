<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171815" id="themeColor">
  <meta name="robots" content="noindex">
  <base href="./">
  <title>Page unavailable — EchoBack</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <script src="src/theme.js"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="./index.html" data-theme-link aria-label="EchoBack home">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
          <path d="M2 10h7l3-5 4 10 3-5h11M2 22h12l3-5 4 10 3-5h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span>EchoBack</span>
      </a>
      <button class="theme-toggle" id="themeToggle" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/>
        </svg>
        <span id="themeLabel">Light mode</span>
      </button>
    </header>
    <main class="document error-page">
      <p class="error-code">Error 500</p>
      <h1>Page unavailable.</h1>
      <p>Try opening EchoBack again in a moment.</p>
      <a href="./index.html" data-theme-link>Back to EchoBack</a>
    </main>
  </div>
</body>
</html>
